name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build; npx electron-builder --win nsis --x64 --publish always

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: Alfadime-Windows
          path: |
            dist/Alfadime-Setup-*.exe
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error